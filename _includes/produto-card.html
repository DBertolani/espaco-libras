<article class="produto-card">

  <div class="produto-card__media">
    {% if include.imagem %}
      <img
        src="{{ include.imagem }}"
        alt="{{ include.alt | default: include.titulo | default: include.title | escape }}"
        loading="lazy"
      >
    {% endif %}
  </div>

  <div class="produto-card__body">

    {% if include.categoria %}
      <span class="produto-card__categoria">{{ include.categoria }}</span>
    {% endif %}

    <h2 class="produto-card__title">
      {{ include.titulo | default: include.title }}
    </h2>

    {% if include.descricao %}
      <p class="produto-card__description">{{ include.descricao }}</p>
    {% endif %}

    <a
      class="produto-card__cta"
      href="{{ include.url | relative_url }}"
      aria-label="Ver {{ include.titulo | default: include.title | escape }}"
    >
      Ver produto
    </a>

  </div>

</article>
